# Netlify deployment configuration for Bunkworks.
# The production site is published from /deploy.

[build]
  publish = "deploy"
  command = "python3 scripts/seo_finalize.py && python3 scripts/seo_validate.py"

[build.environment]
  NODE_VERSION = "20"
  BW_OUT = "deploy"

# SEO/GEO finalization and validation run as one batched build step immediately
# before publish, so the production deployment happens only after all checks pass.
