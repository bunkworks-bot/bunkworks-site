# Netlify deployment configuration for Bunkworks.
# The production site is published from /deploy.

[build]
  publish = "deploy"
  command = "python3 -m py_compile source/*.py scripts/*.py && python3 scripts/pricing_finalize.py && python3 scripts/pricing_copy_finalize.py && python3 scripts/content_authority_finalize.py && python3 scripts/seo_finalize.py && python3 scripts/seo_validate.py"

[build.environment]
  NODE_VERSION = "20"
  BW_OUT = "deploy"

# All content architecture, pricing, SEO/GEO finalization and validation run
# as one batched build immediately before publish. Anniversary pricing runs
# through 15 Oct 2026; regular pricing is applied automatically from 16 Oct 2026.
