name: Apply Bunkworks SEO entity correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-entity-correction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch verified business entity data
        run: python source/patch_verified_entity.py

      - name: Commit generated SEO/entity corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/build_site.py deploy llms.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align Bunkworks local entity and SEO data"
          git push
